name: Upload Repository to GCP Bucket

on:
  push:
    branches:
      - '*'

env:
  GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET }}
  CLOUD_PROVIDER: gcp

jobs:
  upload-to-gcp:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    
    - name: Authenticate and Upload to Google Cloud Storage
      if: env.CLOUD_PROVIDER == 'gcp'
      run: |
        echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" | base64 -d > /tmp/service-account-key.json
        gcloud auth activate-service-account --key-file=/tmp/service-account-key.json
        gsutil -m cp -r . gs://${{ env.GCP_BUCKET }}/content-plugins-test/
        rm -f /tmp/service-account-key.json